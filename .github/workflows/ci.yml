name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  builds:
    uses: ./.github/workflows/build.yml
    with:
      flatpak: bundle
